title: '[Idea] '
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Describe the problem first, then the proposal — that makes it much easier to discuss.

        本库是 `vue3-okr-tree` 的 React 复刻版，两仓自 1.13.0 起同号锁步。行为类想法请说明 Vue 版是否同改；
        已经明确不做的方向（`direction: *-reverse`、垂直 OKR 双向、库内 Tailwind、双语 README、Devtools 等）在
        [`docs/requirements.md`](https://github.com/baiwumm/react-okr-tree/blob/main/docs/requirements.md) §10。
  - type: dropdown
    id: area
    attributes:
      label: 想法属于哪块
      options:
        - API 面（props / 方法 / 事件语义）
        - 渲染定制（render props）
        - 可访问性（role / aria-* / 键盘）
        - 布局与连接线
        - 虚拟滚动与大数据量
        - 类型与产物
        - 文档站与开发体验
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解决什么问题
      description: 你今天遇到的具体场景，以及还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 尤其是现有 props + render props 能不能表达同一个效果。
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 上游 vue3-okr-tree 的实现、录屏、相关讨论。
  - type: checkboxes
    id: checks
    attributes:
      label: 发帖前确认
      options:
        - label: 我检索过已有讨论与文档站。
          required: true
        - label: 我读过 `docs/requirements.md` §10 的「明确不做」清单，本想法不在其中（或在清单里但我有新证据）。
          required: true
        - label: 这是一条想法，不是打包在一起的几条。
          required: true
