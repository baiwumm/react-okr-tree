name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    strategy:
      # 单条矩阵项失败不连带取消其余项，便于一次看清所有 Node 版本的真实结果
      fail-fast: false
      matrix:
        # pnpm 11 依赖 node:sqlite（Node ≥22.5），Node 20 上 setup-node 的 pnpm 缓存步骤会直接崩
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      # 先出 dist：视觉夹具（tests/visual/fixtures）按包名 import 本库，类型走 dist/index.d.ts，
      # 全新 checkout 里没有 dist 时 typecheck 必挂
      - name: Build library
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Coverage (thresholds in vite.config.ts)
        run: pnpm test:coverage

      - name: Verify dist
        run: pnpm verify:dist

      - name: Package checks (publint + attw)
        run: pnpm verify:package

      - name: Size budget (size-limit)
        run: pnpm size

      - name: Pack (dry run)
        working-directory: packages/react-okr-tree
        run: npm pack --dry-run

  # 文档站是 workspace 的第二包：单独一个 job，文档挂了不掩盖库的结论。
  # 关键是「静态导出的真实性」——部署链路（Cloudflare 纯静态资产）依赖它，
  # 所以除了 next build 跑通，还要断言 out/ 里没有任何服务端运行时残留、站内链接不 404。
  website:
    name: Website build (static export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build library (docs site consumes dist)
        run: pnpm build

      # typecheck 放在 build 之后：fumadocs 的 .source 生成物由 next build 产出，
      # 全新 checkout 先 typecheck 必挂（lib/source.ts 的 @/.source/server）
      - name: Build website
        run: pnpm --filter react-okr-tree-website build

      - name: Typecheck website
        run: pnpm typecheck:website

      - name: Verify export is fully static + no dead links
        run: pnpm --filter react-okr-tree-website verify:export

  # peer 范围实测：库的 peer 是 react / react-dom >= 18.2.0，
  # 但开发依赖与文档站都跑 React 19，所以 18.x 这一档必须单独钉一遍。
  # 两条腿：react ~18.2（下限）与 ~18.3，@types/react 跟着降到 18，
  # 这样类型层的 React 19 依赖也会在 18 的类型下编译失败被捕获。
  peer-matrix:
    name: Tests on react ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - react: '~18.2.0'
            types: '~18.3.0'
          - react: '~18.3.0'
            types: '~18.3.0'
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Pin react@${{ matrix.react }} + @types/react@${{ matrix.types }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.pnpm={...p.pnpm,overrides:{...((p.pnpm||{}).overrides||{}),react:'${{ matrix.react }}','react-dom':'${{ matrix.react }}','@types/react':'${{ matrix.types }}','@types/react-dom':'${{ matrix.types }}'}};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      # react 只在库包的 node_modules 里有链接，必须在该包目录下才能 resolve
      - name: Assert resolved versions
        run: |
          cd packages/react-okr-tree
          node -e "console.log('react', require('react/package.json').version, '| @types/react', require('@types/react/package.json').version)"

      # 编译 tests-consumer/consumer.tsx，它 import 的是包名而 paths 指到 dist/index.d.ts：
      # 库自身的 typecheck 编的是 src/，只有这一步能挡住「产物 d.ts 引用了 React 19 独有类型」。
      - name: Typecheck consumer against published d.ts
        run: |
          pnpm build
          pnpm verify:peer-types

      - name: Unit & component tests
        run: pnpm test
