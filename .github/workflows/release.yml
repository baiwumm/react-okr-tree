name: Release

# 发布流程（计划 9.5 ③）：推送 v* tag 后自动校验并发包。
#
# 前置（一次性，由维护者手动完成）：
#   1. GitHub 仓库 Settings → Secrets → 添加 NPM_TOKEN（npmjs.com 的 Automation token）；
#   2. npm 包首次发布可由本 workflow 完成（`npm publish --provenance` 走 OIDC，需仓库公开）。
#
# 日常发布：改 packages/react-okr-tree/package.json 的 version 与 CHANGELOG.md → 提交 →
#          `git tag v1.0.0 && git push origin v1.0.0`。
# 注意 version 与 tag 必须一致（下面有一步专门比对），所以升版要单独一个提交，
# 不要和别的改动混在一起。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # 创建 GitHub Release
  id-token: write # npm provenance（OIDC）

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify & Publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/react-okr-tree
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        # workspace 根安装（Playwright 与文档站都在里面）
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: node -e "const p=require('./package.json'); const t=process.env.GITHUB_REF_NAME.slice(1); if(p.version!==t){console.error('package.json version '+p.version+' != tag '+t);process.exit(1)}"

      - name: Lint / Typecheck / Test
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm test:coverage

      - name: Build & verify dist
        run: |
          pnpm build
          pnpm verify:dist
          pnpm verify:package
          pnpm verify:peer-types
          pnpm size

      # 文档站跟着一起验：它是产物的第一个真实消费者，
      # 发布前发现「装不上 / 类型不对」比发出去再撤版便宜得多。
      - name: Build docs site against dist
        run: pnpm --filter react-okr-tree-website build

      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        working-directory: .
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
