name: Visual Regression

# 视觉回归（计划 9.2）：真实 Chromium 对**静态导出产物**截图比对 + 冒烟交互断言。
# 失败时上传 diff 图与报告，便于定位像素级回归（改 CSS 变量 / 连接线时捕捉）。
#
# runner 镜像永久固定：Linux 基线（*-chromium-linux.png）由系统字体渲染决定。
# 2026-11-04 决定永久 pin ubuntu-24.04，不再跟随 ubuntu-latest 的发行版迁移——
# 镜像换代会让全部 Linux 基线因系统字体变化集体失配，也没有「到期重建基线」这一动作。
# 确需换镜像时必须先用 snapshot-bootstrap.yml 重新生成并提交 Linux 基线。
#
# 与源项目的差别：这里没有独立的 playground，服务器是文档站的 out/ 目录
# （apps/website/scripts/serve-out.mjs，由 playwright.config.ts 的 webServer 拉起），
# 所以构建步骤是「出库 dist → next build 静态导出」，与 website job 同一条链路。

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Playwright Visual · Perf
    runs-on: ubuntu-24.04
    # 兜底：正常全套 ~2 分钟，防止步骤级挂死占住 runner（vue 侧出现过 2 小时挂起）
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/react-okr-tree
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        # 根目录安装（workspace），Playwright 与库都在里面
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build library
        run: pnpm build

      - name: Build docs site (static export)
        run: pnpm --filter react-okr-tree-website build

      - name: Visual & smoke tests
        run: pnpm test:visual

      - name: Upload diff & report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            packages/react-okr-tree/playwright-report/
            packages/react-okr-tree/test-results/
          retention-days: 14
