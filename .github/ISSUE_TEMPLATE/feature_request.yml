name: 💡 Feature request
description: 提议一个功能或改进（API 面、渲染定制、可访问性、文档站、构建产物）
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        **先读这一段：本库是 `vue3-okr-tree` 的 React 复刻版，两仓自 1.13.0 起同号锁步。**

        - 任何改变运行时行为的提案，都要先回答「Vue 版是否同改」——有意差异只能是框架强制产生的，清单在
          [`docs/requirements.md`](https://github.com/baiwumm/react-okr-tree/blob/main/docs/requirements.md) §8（D1–D12）。
        - 已经明确不做的方向写在 §10：`direction: 'vertical-reverse' | 'horizontal-reverse'`、垂直模式的 OKR 双向、
          Tailwind / CSS-in-JS 进组件本体、双语 README、Devtools 集成、`selectedKey` / `orkstyle` 这类从未生效的 API。
          提这些方向之前请先说明新证据。
  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 现有 API 面（props / 方法 / 事件语义）
        - 渲染定制（renderNode / renderExpandBtn / empty 等）
        - 可访问性（role / aria-* / 键盘）
        - 布局与连接线（layout / connector / connectorShape）
        - 虚拟滚动与大数据量
        - 类型声明与产物（d.ts / exports / UMD）
        - 文档站与 Demo
        - 其它
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 先说场景，再说方案——现在卡在哪里、还有谁会受益。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提议的方案
      description: 涉及 API 面时请写清签名、默认值、非法值的处理方式（本库惯例是静默回落到默认值并输出开发期警告）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 包括「不改库，用现有 props / render props 能不能凑出来」。
  - type: textarea
    id: upstream
    attributes:
      label: 与 vue3-okr-tree 的关系
      description: 上游是否已有对应能力 / 对应 issue？如果是 React 独有需求，说明为什么无法用现有差异项（D1–D12）覆盖。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我读过 `docs/requirements.md` §10 的「明确不做」清单，本提案不在其中（或在其中但我给了新证据）。
          required: true
        - label: 这是一条请求，不是多个请求捆在一起。
          required: true
        - label: 我明白行为类改动需要 Vue 仓同步，我已在「与 vue3-okr-tree 的关系」里说明。
          required: true
