name: Snapshot Bootstrap

# 一次性生成 Linux 视觉基线（配合计划 9.2）。
# 背景：仓库里目前只有 *-chromium-win32.png，而 Visual Regression job 跑在 ubuntu 上，
# Playwright 找的是 *-chromium-linux.png；缺失基线时 updateSnapshots: 'missing' 依然返回
# softError 判该用例失败（playwright 的 handleMissing），所以新平台首轮必红，
# "CI 自动补齐"并不成立。
#
# 用法：
#   1. Actions → Snapshot Bootstrap → Run workflow（main 分支）；
#   2. 下载 artifact `linux-snapshots`，在 packages/react-okr-tree/ 下解包：
#      tar -xzf linux-snapshots.tgz（tar 里的路径相对库包：tests/visual/…-snapshots/）；
#      已装 gh CLI 可直接：gh run download <RUN_ID> -n linux-snapshots
#      && tar -xzf linux-snapshots.tgz -C packages/react-okr-tree
#   3. git add 这些 *-chromium-linux.png 并提交，Visual Regression 即转绿。
#
# 构建步骤必须与 visual.yml 完全一致（同镜像、同 Playwright 版本、同「库 dist → 静态导出」链路），
# 否则生成的基线与门禁跑的产物不是同一份。
#
# 2026-11-04（Z8）：新增的 4 张用例基线（connector-svg-orthogonal / connector-svg-straight /
# site-dark-basic / site-dark-okr-group）只提交了 win32 版；合并后必须再跑一次本 workflow 补齐
# 对应 *-chromium-linux.png。解包后先用 `git status --short` 核对：应当只多这 4 个文件，
# 既有 *-linux.png 不应出现 diff（有 diff 说明系统字体或渲染变了，必须逐张看图再提交）。
# 在补齐之前，Visual Regression 会因这 4 条缺 Linux 基线而判红——这是缺基线，不是回归。
#
# 2026-11-25（站点改暗色优先）：上面的「只多几个文件、既有基线零 diff」这一批的口径**反过来了**。
# demo 块底色来自页面，站点换底色（c5d5a12）后 19 名基线全部作废；11-25 只重拍了 win32
# （791fd92），`site-dark-*` 两张 `-linux` 随改名被删，其余 17 张仍是 11-04 的旧底色。
# 所以这批的预期清单是 **19 个文件全变**：17 个 `M` + `site-light-basic` / `site-light-okr-group`
# 两个 `??`。判断依据从「既有基线不该有 diff」改为「只变这 19 个、没有第 20 个」。
# `--ref` 必须带着这批改动（`45b8dc7` 改了 demo 的 URL 结构，见 tests/visual/helpers.ts 的
# DEMO_PAGES / openDemo）：在旧 ref 上跑会让用例找不到 `#demo-*`，拍出来的不是基线而是废图。

on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: Generate linux snapshots
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/react-okr-tree
    steps:
      - uses: actions/checkout@v5
        with:
          # 文档站的「最后更新」与 sitemap <lastmod> 由 fumadocs 读 git 提交时间生成，
          # actions/checkout 默认 shallow（depth=1）会把所有文件算成同一个最新提交时间，
          # 必需完整历史才能拿到每个 content 文件的真实日期
          fetch-depth: 0

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build library
        run: pnpm build

      - name: Build docs site (static export)
        run: pnpm --filter react-okr-tree-website build

      # 本 job 的产出是基线文件而非门禁结论：冒烟/性能用例在 runner 上可能因机器抖动超标，
      # 不应阻止 artifact 上传，故 continue-on-error。
      - name: Generate baselines
        continue-on-error: true
        run: pnpm test:visual:update

      - name: Pack baselines
        run: |
          find tests/visual -name '*-linux.png' | sort > linux-snapshots.txt
          cat linux-snapshots.txt
          test -s linux-snapshots.txt
          tar -czf ../../linux-snapshots.tgz --no-recursion -T linux-snapshots.txt

      - name: Upload baselines
        uses: actions/upload-artifact@v7
        with:
          name: linux-snapshots
          path: linux-snapshots.tgz
          retention-days: 14
          if-no-files-found: error
